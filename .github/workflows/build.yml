name: Build GKI 6.6 KSU + SUSFS

on:
  workflow_dispatch:

jobs:
  build-gki:
    runs-on: ubuntu-22.04
    steps:
    - name: Kosongkan Ruang Penyimpanan Server
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        docker rmi $(docker image ls -aq)
        sudo apt-get clean
        df -h

    - name: Install Dependensi GKI
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl bc bison flex libssl-dev make

    - name: Setup Repo & Download Source GKI 6.6
      run: |
        mkdir ~/bin
        PATH=~/bin:$PATH
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        
        mkdir kernel_workspace && cd kernel_workspace
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Mengunduh source code GKI 6.6 resmi dari Google
        repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.6 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Download Patch SUSFS 
      run: |
        # Mengambil patch khusus untuk cabang GKI 6.6
        git clone -b gki-android14-6.6 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
        
        # Memasukkan file SUSFS ke dalam source code
        cp -r susfs4ksu/kernel_patches/fs/* kernel_workspace/common/fs/ || true
        cp -r susfs4ksu/kernel_patches/include/linux/* kernel_workspace/common/include/linux/ || true

    - name: Pasang KernelSU
      run: |
        cd kernel_workspace/common
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

    - name: Terapkan Patch SUSFS ke Kernel & KSU
      run: |
        cd kernel_workspace/common
        # Patch VFS Kernel
        patch -p1 < ../../susfs4ksu/kernel_patches/50_recipe_susfs.patch || echo "Patch VFS dilewati/selesai"
        
        # Patch KernelSU
        cd KernelSU
        patch -p1 < ../../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || echo "Patch KSU dilewati/selesai"

    - name: Build Kernel (Image) dengan Bazel
      run: |
        cd kernel_workspace
        tools/bazel build --config=fast --config=stamp //common:kernel_aarch64

    - name: Upload Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: File-Image-GKI-6.6-KSU-SUSFS
        path: kernel_workspace/**/Image
